services:
  postgres:
    image: postgres:17
    container_name: world_bank_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    ports:
      # 127.0.0.1: aceita conexões só desta máquina, não da rede local.
      # 5433 no Windows: a 5432 costuma estar ocupada por um PostgreSQL instalado.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ponte única para o Claude Code consultar o banco, só com leitura (D-076).
  # Perfil "mcp": é ferramenta de desenvolvimento, e o pipeline e o CI não precisam dela.
  mcp:
    image: crystaldba/postgres-mcp@sha256:dbbd346860d29f1543e991f30f3284bf4ab5f096d049ecc3426528f20b1b6e6b
    container_name: world_bank_mcp
    profiles: [mcp]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["--access-mode=restricted", "--transport=sse", "--sse-host=0.0.0.0", "--sse-port=8000"]
    ports:
      # 127.0.0.1: a ponte não pede senha, então só esta máquina pode chamá-la.
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
